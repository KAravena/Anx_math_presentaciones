<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 405" role="img" aria-label="Metaanálisis de Barroso et al. 2021, correlación media negativa r igual a menos cero coma veintiocho entre ansiedad matemática y rendimiento." style="width:100%;height:100%;display:block;overflow:visible"><text x="107" y="53" font-family="Arial,Segoe UI,sans-serif" font-size="21" font-weight="740" fill="#67418A" >METAANÁLISIS · BARROSO ET AL. (2021)</text><text x="94" y="237" font-family="Arial,Segoe UI,sans-serif" font-size="118" font-weight="740" fill="#4B2875" >r = −0,28</text><line x1="575" y1="65" x2="575" y2="296" stroke="#E6DBEF" stroke-width="2"/><text x="621" y="136" font-family="Arial,Segoe UI,sans-serif" font-size="35" font-weight="690" fill="#302A38" >Asociación negativa</text><text x="622" y="187" font-family="Arial,Segoe UI,sans-serif" font-size="26" font-weight="510" fill="#302A38" >En promedio, mayor ansiedad</text><text x="622" y="224" font-family="Arial,Segoe UI,sans-serif" font-size="26" font-weight="510" fill="#302A38" >se relaciona con menor</text><text x="622" y="261" font-family="Arial,Segoe UI,sans-serif" font-size="26" font-weight="510" fill="#302A38" >rendimiento matemático.</text></svg>