<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 405" role="img" aria-label="PISA 2022: en varios sistemas latinoamericanos los estudiantes socioeconómicamente favorecidos se concentran relativamente más en determinadas escuelas; fundamento de la comparación entre sistemas." style="width:100%;height:100%;display:block;overflow:visible"><text x="545" y="48" font-family="Arial,Segoe UI,sans-serif" font-size="19" font-weight="750" fill="#67418A" text-anchor="middle" >DE LA COMPOSICIÓN DE UNA ESCUELA → A LA DISTRIBUCIÓN EN EL SISTEMA</text><text x="545" y="121" font-family="Arial,Segoe UI,sans-serif" font-size="31" font-weight="690" fill="#302A38" text-anchor="middle" >PISA 2022 documenta una concentración relativa</text><text x="545" y="166" font-family="Arial,Segoe UI,sans-serif" font-size="31" font-weight="690" fill="#302A38" text-anchor="middle" >de estudiantes favorecidos en ciertas escuelas</text><text x="545" y="209" font-family="Arial,Segoe UI,sans-serif" font-size="25" font-weight="500" fill="#6B6571" text-anchor="middle" >de varios sistemas latinoamericanos.</text><line x1="193" y1="232" x2="897" y2="232" stroke="#E6DBEF" stroke-width="2"/><text x="545" y="274" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="740" fill="#4B2875" text-anchor="middle" >BRASIL · CHILE · COLOMBIA</text><text x="545" y="312" font-family="Arial,Segoe UI,sans-serif" font-size="24" font-weight="740" fill="#4B2875" text-anchor="middle" >PANAMÁ · PARAGUAY · URUGUAY</text><text x="545" y="372" font-family="Arial,Segoe UI,sans-serif" font-size="20" font-weight="610" fill="#302A38" text-anchor="middle" >Comparar sistemas permite examinar contextos escolares socialmente diferenciados.</text></svg>