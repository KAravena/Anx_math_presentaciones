<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="405" viewBox="0 0 1090 405" role="img" aria-label="Seis afirmaciones del cuestionario PISA 2022 ST292, con cuatro opciones de respuesta, permiten construir el índice ANXMAT por escalamiento psicométrico"><rect x="0" y="0" width="1090" height="405" fill="#FFFFFF"/><text x="18" y="28" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="760" text-anchor="start" letter-spacing="0.8">SEIS AFIRMACIONES · CUESTIONARIO PISA 2022</text><text x="1071" y="28" fill="#67418A" font-family="Arial, Segoe UI, sans-serif" font-size="16" font-weight="720" text-anchor="end">ST292</text><rect x="18" y="43" width="518" height="72" rx="10" fill="#FAF8FC" stroke="#E5D9EF" stroke-width="1.2"/><rect x="31" y="56" width="45" height="45" rx="8" fill="#ECE5F4" stroke="#ECE5F4" stroke-width="0"/><text x="53.5" y="85" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="730" text-anchor="middle">01</text><text x="90" y="73" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">Me preocupa que las clases de</text><text x="90" y="98" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">matemáticas sean difíciles.</text><rect x="18" y="123" width="518" height="72" rx="10" fill="#FAF8FC" stroke="#E5D9EF" stroke-width="1.2"/><rect x="31" y="136" width="45" height="45" rx="8" fill="#ECE5F4" stroke="#ECE5F4" stroke-width="0"/><text x="53.5" y="165" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="730" text-anchor="middle">02</text><text x="90" y="153" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">Me pongo muy tenso al hacer</text><text x="90" y="178" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">tareas de matemáticas.</text><rect x="18" y="203" width="518" height="72" rx="10" fill="#FAF8FC" stroke="#E5D9EF" stroke-width="1.2"/><rect x="31" y="216" width="45" height="45" rx="8" fill="#ECE5F4" stroke="#ECE5F4" stroke-width="0"/><text x="53.5" y="245" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="730" text-anchor="middle">03</text><text x="90" y="233" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">Me pongo muy nervioso al</text><text x="90" y="258" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">resolver problemas matemáticos.</text><rect x="566" y="43" width="518" height="72" rx="10" fill="#FAF8FC" stroke="#E5D9EF" stroke-width="1.2"/><rect x="579" y="56" width="45" height="45" rx="8" fill="#ECE5F4" stroke="#ECE5F4" stroke-width="0"/><text x="601.5" y="85" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="730" text-anchor="middle">04</text><text x="638" y="73" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">Me siento impotente ante un</text><text x="638" y="98" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">problema de matemáticas.</text><rect x="566" y="123" width="518" height="72" rx="10" fill="#FAF8FC" stroke="#E5D9EF" stroke-width="1.2"/><rect x="579" y="136" width="45" height="45" rx="8" fill="#ECE5F4" stroke="#ECE5F4" stroke-width="0"/><text x="601.5" y="165" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="730" text-anchor="middle">05</text><text x="638" y="153" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">Me preocupa obtener malas</text><text x="638" y="178" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">calificaciones en matemáticas.</text><rect x="566" y="203" width="518" height="72" rx="10" fill="#FAF8FC" stroke="#E5D9EF" stroke-width="1.2"/><rect x="579" y="216" width="45" height="45" rx="8" fill="#ECE5F4" stroke="#ECE5F4" stroke-width="0"/><text x="601.5" y="245" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="730" text-anchor="middle">06</text><text x="638" y="233" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">Siento ansiedad ante la</text><text x="638" y="258" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="590" text-anchor="start">posibilidad de reprobar matemáticas.</text><line x1="18" y1="291" x2="1070" y2="291" stroke="#E9E1F1" stroke-width="1.7"/><text x="18" y="318" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="740" text-anchor="start">RESPUESTAS</text><text x="151" y="318" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="520" text-anchor="start">Muy en desacuerdo · En desacuerdo · De acuerdo · Muy de acuerdo</text><rect x="18" y="335" width="1053" height="56" rx="10" fill="#F5F0FA" stroke="#F5F0FA" stroke-width="0"/><text x="545" y="369" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" text-anchor="middle">Respuestas → escalamiento psicométrico → índice ANXMAT (↑ = mayor ansiedad)</text></svg>