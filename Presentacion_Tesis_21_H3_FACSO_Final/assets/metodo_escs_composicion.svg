<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="405" viewBox="0 0 1090 405" role="img" aria-label="Componentes PAREDINT, HISEI, HOMEPOS forman ESCS individual; la media ponderada de ESCS de los estudiantes forma la composición escolar"><rect x="0" y="0" width="1090" height="405" fill="#FFFFFF"/><text x="19" y="30" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="18" font-weight="740" text-anchor="start" letter-spacing="0.8">DE LA INFORMACIÓN FAMILIAR AL ÍNDICE INDIVIDUAL</text><rect x="18" y="48" width="344" height="101" rx="11" fill="#FAF8FC" stroke="#E5D9EF" stroke-width="1.3"/><text x="35" y="78" fill="#67418A" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="750" text-anchor="start">EDUCACIÓN PARENTAL</text><text x="35" y="105" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="720" text-anchor="start">PAREDINT</text><text x="35" y="130" fill="#6B6571" font-family="Arial, Segoe UI, sans-serif" font-size="16.3" font-weight="500" text-anchor="start">Nivel educativo de los padres</text><path d="M190 149 L190 167" fill="none" stroke="#8969AB" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="380" y="48" width="344" height="101" rx="11" fill="#FAF8FC" stroke="#E5D9EF" stroke-width="1.3"/><text x="397" y="78" fill="#67418A" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="750" text-anchor="start">ESTATUS OCUPACIONAL</text><text x="397" y="105" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="720" text-anchor="start">HISEI</text><text x="397" y="130" fill="#6B6571" font-family="Arial, Segoe UI, sans-serif" font-size="16.3" font-weight="500" text-anchor="start">Ocupación de mayor estatus</text><path d="M552 149 L552 167" fill="none" stroke="#8969AB" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><rect x="742" y="48" width="344" height="101" rx="11" fill="#FAF8FC" stroke="#E5D9EF" stroke-width="1.3"/><text x="759" y="78" fill="#67418A" font-family="Arial, Segoe UI, sans-serif" font-size="17" font-weight="750" text-anchor="start">POSESIONES DEL HOGAR</text><text x="759" y="105" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="720" text-anchor="start">HOMEPOS</text><text x="759" y="130" fill="#6B6571" font-family="Arial, Segoe UI, sans-serif" font-size="16.3" font-weight="500" text-anchor="start">Bienes y recursos del hogar</text><path d="M914 149 L914 167" fill="none" stroke="#8969AB" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M190 167 H900" fill="none" stroke="#8969AB" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/><path d="M545 167 V181" fill="none" stroke="#8969AB" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><rect x="285" y="182" width="520" height="76" rx="12" fill="#F3EDF8" stroke="#DACAE9" stroke-width="1.3"/><text x="545" y="213" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="740" text-anchor="middle">ÍNDICE ESCS INDIVIDUAL</text><text x="545" y="240" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="17.5" font-weight="540" text-anchor="middle">Tres componentes estandarizados con igual ponderación</text><path d="M545 258 V276" fill="none" stroke="#8969AB" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><path d="M539 270 L545 277 L551 270" fill="none" stroke="#8969AB" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/><rect x="128" y="279" width="834" height="95" rx="12" fill="#FFFFFF" stroke="#D4C2E3" stroke-width="1.5"/><text x="545" y="308" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="730" text-anchor="middle">COMPOSICIÓN SOCIOECONÓMICA ESCOLAR</text><text x="545" y="338" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="550" text-anchor="middle">Media ponderada del ESCS de estudiantes muestreados en la escuela</text><text x="545" y="361" fill="#6B6571" font-family="Arial, Segoe UI, sans-serif" font-size="15.5" font-weight="500" text-anchor="middle">Calculada antes del filtro analítico final de la tesis</text><text x="545" y="397" fill="#6B6571" font-family="Arial, Segoe UI, sans-serif" font-size="14.5" font-weight="480" text-anchor="middle">Las flechas representan construcción de medidas, no relaciones causales.</text></svg>