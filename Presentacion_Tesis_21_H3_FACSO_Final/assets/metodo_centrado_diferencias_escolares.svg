<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="405" viewBox="0 0 1090 405" role="img" aria-label="Centrado intraescuela de ANXMAT y ESCS y diferencias entre escuelas en composición y pendientes. El centrado no elimina la variación de pendientes."><rect x="0" y="0" width="1090" height="405" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0"/><rect x="18" y="26" width="516" height="299" rx="12" fill="#FCFAFD" stroke="#E5D9EF" stroke-width="1.3"/><rect x="554" y="26" width="517" height="299" rx="12" fill="#FCFAFD" stroke="#E5D9EF" stroke-width="1.3"/><rect x="18" y="26" width="516" height="6" rx="2" fill="#4B2875" stroke="#4B2875" stroke-width="0"/><rect x="554" y="26" width="517" height="6" rx="2" fill="#8969AB" stroke="#8969AB" stroke-width="0"/><text x="39" y="70" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="760" text-anchor="start">DENTRO DE CADA ESCUELA</text><text x="39" y="116" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="740" text-anchor="start">ANXMAT y ESCS individual</text><text x="39" y="157" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="520" text-anchor="start">Cada estudiante se compara con</text><text x="39" y="185" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="520" text-anchor="start">el promedio de su escuela.</text><line x1="40" y1="207" x2="510" y2="207" stroke="#E5D9EF" stroke-width="1.4"/><rect x="43" y="227" width="208" height="68" rx="10" fill="#F2EBF7" stroke="#F2EBF7" stroke-width="0"/><rect x="303" y="227" width="209" height="68" rx="10" fill="#F2EBF7" stroke="#F2EBF7" stroke-width="0"/><text x="147" y="255" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Valor individual</text><text x="147" y="281" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="17.2" font-weight="530" text-anchor="middle">del estudiante</text><line x1="258" y1="262" x2="296" y2="262" stroke="#8969AB" stroke-width="2.1"/><path d="M287 256 L297 262 L287 268" fill="none" stroke="#8969AB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="408" y="255" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">Referencia</text><text x="408" y="281" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="17.2" font-weight="530" text-anchor="middle">promedio escolar</text><text x="575" y="70" fill="#67418A" font-family="Arial, Segoe UI, sans-serif" font-size="19" font-weight="760" text-anchor="start">ENTRE ESCUELAS</text><text x="575" y="113" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="730" text-anchor="start">Composición socioeconómica</text><text x="575" y="151" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="530" text-anchor="start">Cada escuela respecto del promedio</text><text x="575" y="178" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="530" text-anchor="start">de su sistema educativo.</text><line x1="575" y1="200" x2="1048" y2="200" stroke="#E5D9EF" stroke-width="1.4"/><text x="575" y="236" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="730" text-anchor="start">Pendientes ansiedad–rendimiento</text><text x="575" y="274" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="530" text-anchor="start">La intensidad de la asociación</text><text x="575" y="301" fill="#302A38" font-family="Arial, Segoe UI, sans-serif" font-size="20.5" font-weight="530" text-anchor="start">puede variar entre escuelas.</text><rect x="18" y="342" width="1053" height="53" rx="10" fill="#F2EBF7" stroke="#F2EBF7" stroke-width="0"/><text x="545" y="376" fill="#4B2875" font-family="Arial, Segoe UI, sans-serif" font-size="22" font-weight="740" text-anchor="middle">Centrar ANXMAT no elimina la variación de pendientes entre escuelas.</text></svg>