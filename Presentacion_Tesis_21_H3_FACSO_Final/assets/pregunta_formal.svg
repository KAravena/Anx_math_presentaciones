<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 405" role="img" aria-label="Pregunta oficial de investigación tomada literalmente de la tesis"><rect x="30" y="26" width="1030" height="335" rx="18" fill="#F5F0FA" stroke="#E6DBEF" stroke-width="1.4"/><rect x="30" y="26" width="8" height="335" rx="4" fill="#4B2875"/><text x="74" y="94" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="620" font-size="27" fill="#302A38">¿Cómo varía la asociación intraescuela entre ansiedad matemática</text><text x="74" y="138" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="620" font-size="27" fill="#302A38">y rendimiento matemático entre escuelas de 13 sistemas educativos</text><text x="74" y="182" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="620" font-size="27" fill="#302A38">de América Latina y el Caribe, cómo se compara su magnitud</text><text x="74" y="226" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="620" font-size="27" fill="#302A38">promedio entre sistemas y en qué medida la heterogeneidad</text><text x="74" y="270" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="620" font-size="27" fill="#302A38">entre escuelas se relaciona con la composición socioeconómica</text><text x="74" y="314" text-anchor="start" font-family="Arial,Helvetica,sans-serif" font-weight="620" font-size="27" fill="#302A38">escolar en PISA 2022?</text><text x="545" y="390" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="650" font-size="17" fill="#67418A">Variación entre escuelas  ·  Comparación entre sistemas  ·  Composición socioeconómica</text></svg>