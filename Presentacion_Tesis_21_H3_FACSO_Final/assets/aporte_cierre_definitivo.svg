<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="1100" height="370" role="img" aria-label="Aporte esperado a la Psicología Educacional: ampliar la comprensión de la asociación entre ansiedad matemática y rendimiento, examinando contextos escolares socialmente diferenciados y comparando 13 sistemas de América Latina y el Caribe.">
<rect width="1100" height="370" fill="#FFFFFF"/>
<style>text{font-family:Arial,'Segoe UI',sans-serif} .kicker{font-size:16.5px;font-weight:760;letter-spacing:1.9px;fill:#67418A}.main{font-size:31.7px;fill:#302A38;font-weight:690}.subhead{font-size:25px;font-weight:730;fill:#4B2875}.body{font-size:21.2px;fill:#302A38;font-weight:470}.finish{font-size:17px;font-weight:570;fill:#67418A}</style>
<text class="kicker" x="42" y="27">CONTRIBUCIÓN A LA PSICOLOGÍA EDUCACIONAL</text>
<line x1="42" y1="43" x2="1058" y2="43" stroke="#E6DBEF" stroke-width="2"/>
<line x1="43" y1="55" x2="43" y2="158" stroke="#4B2875" stroke-width="4"/>
<text class="main" x="65" y="82">Ampliar la comprensión de la relación entre</text>
<text class="main" x="65" y="119">ansiedad matemática y rendimiento,</text>
<text class="main" x="65" y="156">examinando cómo varía entre escuelas socialmente diferenciadas.</text>
<line x1="42" y1="174" x2="1058" y2="174" stroke="#E6DBEF" stroke-width="1.7"/>
<text class="subhead" x="55" y="210">Dimensión contextual</text>
<text class="body" x="55" y="241">Examinar si la composición</text>
<text class="body" x="55" y="268">socioeconómica escolar se relaciona</text>
<text class="body" x="55" y="295">con la intensidad de esta asociación.</text>
<line x1="550" x2="550" y1="190" y2="303" stroke="#E6DBEF" stroke-width="1.7"/>
<text class="subhead" x="587" y="210">Dimensión regional</text>
<text class="body" x="587" y="241">Aportar evidencia comparativa de</text>
<text class="body" x="587" y="268">13 sistemas educativos de América</text>
<text class="body" x="587" y="295">Latina y el Caribe.</text>
<line x1="42" y1="314" x2="1058" y2="314" stroke="#E6DBEF" stroke-width="1.7"/>
<text class="finish" x="550" y="337" text-anchor="middle">Una mirada psicológico-educacional que integra la experiencia emocional del aprendizaje</text>
<text class="finish" x="550" y="361" text-anchor="middle">y el contexto socioeconómico escolar. · Evidencia asociativa, no causal</text>
</svg>