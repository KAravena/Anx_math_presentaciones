<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="1100" height="380" role="img" aria-label="Cuatro decisiones de estimación: modelos multinivel ponderados por sistema; diez valores plausibles; interpretación con pendientes simples y contraste FDR de H3; metaanálisis de efectos aleatorios entre sistemas.">
