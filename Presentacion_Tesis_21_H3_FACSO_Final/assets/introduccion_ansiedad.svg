<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 405" role="img" aria-label="La ansiedad matemática es tensión, preocupación o aprensión ante situaciones matemáticas. PISA 2022 identifica a Chile entre los sistemas con niveles elevados de ansiedad matemática." style="width:100%;height:100%;display:block;overflow:visible"><text x="85" y="53" font-family="Arial,Segoe UI,sans-serif" font-size="20" font-weight="750" fill="#67418A" >¿QUÉ ES?</text><line x1="84" y1="72" x2="516" y2="72" stroke="#E6DBEF" stroke-width="2"/><text x="84" y="133" font-family="Arial,Segoe UI,sans-serif" font-size="33" font-weight="660" fill="#302A38" >Tensión, preocupación</text><text x="84" y="178" font-family="Arial,Segoe UI,sans-serif" font-size="33" font-weight="660" fill="#302A38" >o aprensión ante</text><text x="84" y="223" font-family="Arial,Segoe UI,sans-serif" font-size="33" font-weight="660" fill="#302A38" >situaciones matemáticas</text><line x1="544" y1="56" x2="544" y2="313" stroke="#E6DBEF" stroke-width="2"/><text x="594" y="53" font-family="Arial,Segoe UI,sans-serif" font-size="20" font-weight="750" fill="#67418A" >¿QUÉ MUESTRA PISA 2022?</text><text x="594" y="126" font-family="Arial,Segoe UI,sans-serif" font-size="43" font-weight="750" fill="#4B2875" >CHILE</text><text x="594" y="178" font-family="Arial,Segoe UI,sans-serif" font-size="28" font-weight="540" fill="#302A38" >Entre los sistemas con</text><text x="594" y="215" font-family="Arial,Segoe UI,sans-serif" font-size="28" font-weight="540" fill="#302A38" >niveles elevados de</text><text x="594" y="252" font-family="Arial,Segoe UI,sans-serif" font-size="28" font-weight="540" fill="#302A38" >ansiedad matemática.</text></svg>